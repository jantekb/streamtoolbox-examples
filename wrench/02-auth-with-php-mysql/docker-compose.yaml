services:
  php:
    build: .
    container_name: login-app
    ports:
      - "8090:80"
    volumes:
      - ./www:/var/www/html
    depends_on:
      - mysql

  mysql:
    image: mysql:8
    container_name: mysql-db
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
    volumes:
      - dbdata:/var/lib/mysql
      - ./dbinit/setup.sql:/docker-entrypoint-initdb.d/setup.sql:ro

volumes:
  dbdata: